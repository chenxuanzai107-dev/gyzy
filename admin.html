<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理后台 | 建工青协</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9825;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<style>
/* extra admin styles */
.form-group textarea { resize: vertical; min-height: 60px; }
.admin-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/* Cover upload area */
.cover-upload-area { border: 2px dashed #d1d5db; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 200ms; background: #fafafa; position: relative; }
.cover-upload-area:hover, .cover-upload-area.drag-over { border-color: #F59E0B; background: #FFFBEB; }
.cover-upload-icon { font-size: 32px; margin-bottom: 8px; }
.cover-upload-area p { color: #666; font-size: 14px; margin: 0; }
.cover-upload-area small { color: #999; font-size: 12px; }
.cover-preview { position: relative; border-radius: 12px; overflow: hidden; }
.cover-preview img { width: 100%; height: 180px; object-fit: cover; display: block; }
.cover-preview-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
@media (max-width: 768px) {
  .admin-stats-grid { grid-template-columns: repeat(2, 1fr); }
  .admin-table { font-size: 12px; }
}
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">建工青协</div>
    <nav class="admin-nav">
      <div class="admin-nav-item active" data-tab="dashboard"><span class="admin-nav-icon">📊</span><span>仪表盘</span></div>
      <div class="admin-nav-item" data-tab="applications"><span class="admin-nav-icon">📋</span><span>报名管理</span></div>
      <div class="admin-nav-item" data-tab="messages"><span class="admin-nav-icon">💬</span><span>留言管理</span></div>
      <div class="admin-nav-item" data-tab="activities"><span class="admin-nav-icon">📅</span><span>活动管理</span></div>
      <div class="admin-nav-item" data-tab="stats"><span class="admin-nav-icon">📈</span><span>统计管理</span></div>
    </nav>
    <div class="admin-sidebar-footer">
      <button id="logoutBtn" class="btn btn-outline btn-sm" style="width:100%;color:#fff;border-color:rgba(255,255,255,0.2);">🚪 退出登录</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <h1>管理后台</h1>
      <div class="admin-topbar-right">
        <span id="adminUserEmail">管理员</span>
        <a href="index.html" class="btn btn-outline btn-sm">🏠 前台</a>
      </div>
    </header>
    <div class="admin-content" id="adminContent"><div class="admin-loading">验证登录...</div></div>
  </div>
</div>

<script>
// admin.js v2 — dashboard auto-refresh after CRUD, cache version bust
(function () {
  'use strict';

  var SUPABASE_URL = 'https://pzyijmgcksmyagdvdgoq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eWlqbWdja3NteWFnZHZkZ29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEzMTIsImV4cCI6MjA5NTMxNzMxMn0._sohNeH4Zh7qTaqLd0b8gY3GKg3t4ShJTSCkNEQfAyI';

  var token = localStorage.getItem('gyzy_token');
  var user = null;
  var adminRole = null;
  var currentTab = 'dashboard';

  // 带 token 的请求头
  function headers() {
    var h = { 'apikey': ANON_KEY, 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  function loadContent(html) {
    document.getElementById('adminContent').innerHTML = html;
  }

  // ====== 启动: 验证身份 ======
  if (!token) {
    loadContent('<div class="admin-empty"><h2>未登录</h2><p>即将跳转到登录页...</p></div>');
    setTimeout(function() { window.location.href = 'login.html'; }, 1000);
  } else {
    loadContent('<div class="admin-loading">正在验证身份...</div>');
    fetch(SUPABASE_URL + '/auth/v1/user', { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token } })
      .then(function(r) {
        if (!r.ok) { localStorage.clear(); window.location.href = 'login.html'; throw new Error('auth'); }
        return r.json();
      })
      .then(function(u) {
        user = u;
        console.log('[ADMIN] User:', u.email);
        // 查 admin_users 表
        return fetch(SUPABASE_URL + '/rest/v1/admin_users?id=eq.' + u.id, { headers: headers() });
      })
      .then(function(r) { return r.json(); })
      .then(function(admins) {
        if (!admins || !admins.length) {
          loadContent('<div class="admin-empty"><h2>无权限</h2><p>当前账号无后台管理权限</p><button onclick="localStorage.clear();window.location.href=\'index.html\'" class="btn btn-primary btn-sm" style="margin-top:16px;">返回首页</button></div>');
          return;
        }
        adminRole = admins[0].role;
        console.log('[ADMIN] Role:', adminRole);
        document.getElementById('adminUserEmail').textContent = user.email + ' (' + (adminRole === 'super' ? '超管' : '管理员') + ')';
        initTabs();
        loadDashboard();
      })
      .catch(function(e) {
        if (e.message !== 'auth') {
          loadContent('<div class="admin-empty"><h2>连接失败</h2><p>无法连接 Supabase 服务器，请检查网络</p><a href="login.html" class="btn btn-primary btn-sm" style="margin-top:16px;">重新登录</a></div>');
        }
      });
  }

  // ====== Tab 切换 ======
  function initTabs() {
    document.querySelectorAll('.admin-nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        document.querySelectorAll('.admin-nav-item').forEach(function(i) { i.classList.remove('active'); });
        item.classList.add('active');
        currentTab = item.getAttribute('data-tab');
        if (currentTab === 'dashboard') loadDashboard();
        else if (currentTab === 'applications') loadApplications();
        else if (currentTab === 'messages') loadMessages();
        else if (currentTab === 'activities') loadActivities();
        else if (currentTab === 'stats') loadStats();
      });
    });
  }

  // 静默刷新仪表盘(只在仪表盘可见时更新 DOM)
  function refreshDashboardIfVisible() {
    if (currentTab !== 'dashboard') return; // 不在仪表盘页，跳过
    if (!document.getElementById('refreshDashboard')) return; // 还没渲染

    function count(path) {
      return fetch(SUPABASE_URL + '/rest/v1/' + path + '?select=count', { headers: headers() })
        .then(function(r){ if(!r.ok) throw new Error('err'); return r.json(); })
        .then(function(d){ return d[0]?.count || 0; })
        .catch(function(){ return 0; });
    }

    Promise.allSettled([
      count('applications'), count('applications?status=eq.pending'),
      count('messages'), count('messages?is_handled=eq.false'), count('activities'),
      fetch(SUPABASE_URL + '/rest/v1/site_stats?select=*', { headers: headers() }).then(function(r){return r.json();}).catch(function(){return [];}),
    ]).then(function(r) {
      var apps = r[0].value, pend = r[1].value, msgs = r[2].value;
      var unread = r[3].value, acts = r[4].value, stats = r[5].value || [];
      var hours = (stats.find(function(s){return s.key==='service_hours';}) || {}).value || 3200;
      // 只更新数字，不替换整页
      var cards = document.querySelectorAll('.admin-stat-num');
      if (cards.length >= 6) {
        cards[0].textContent = apps;
        cards[1].textContent = pend; cards[1].style.color = pend > 0 ? '#DC2626' : '';
        cards[2].textContent = msgs;
        cards[3].textContent = unread; cards[3].style.color = unread > 0 ? '#DC2626' : '';
        cards[4].textContent = acts;
        cards[5].textContent = hours;
        var ts = document.getElementById('dashTimestamp');
        if (ts) ts.textContent = '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
      }
    });
  }

  // ====== 仪表盘 (动态数据 + 刷新按钮 + 时间戳) ======
  function loadDashboard() {
    loadContent('<div class="admin-loading">加载中...</div>');

    function count(path) {
      var url = SUPABASE_URL + '/rest/v1/' + path + '?select=count';
      return fetch(url, { headers: headers() })
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(d){ return d[0]?.count || 0; })
        .catch(function(e){ console.error('[DASH] count error:', path, e); return 0; });
    }

    Promise.allSettled([
      count('applications'),
      count('applications?status=eq.pending'),
      count('messages'),
      count('messages?is_handled=eq.false'),
      count('activities'),
      fetch(SUPABASE_URL + '/rest/v1/site_stats?select=*', { headers: headers() })
        .then(function(r){ return r.json(); }).catch(function(){ return []; }),
    ]).then(function(r) {
      var apps = r[0].value, pendingApps = r[1].value, msgs = r[2].value;
      var unhandled = r[3].value, acts = r[4].value, stats = r[5].value || [];
      var hours = (stats.find(function(s){return s.key==='service_hours';}) || {}).value || 3200;
      var now = new Date().toLocaleTimeString('zh-CN');

      loadContent('<h2>仪表盘</h2>'
        + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">'
        + '<button id="refreshDashboard" class="btn btn-sm btn-outline">🔄 刷新数据</button>'
        + '<span id="dashTimestamp" style="font-size:12px;color:#999;">最后更新: ' + now + '</span>'
        + '</div>'
        + '<div class="admin-stats-grid">'
        + card(apps, '报名总数') + card(pendingApps, '待审核', pendingApps > 0 ? '#DC2626' : '')
        + card(msgs, '留言总数') + card(unhandled, '未处理', unhandled > 0 ? '#DC2626' : '')
        + card(acts, '活动总数') + card(hours, '服务时长(h)')
        + '</div><p style="margin-top:24px;color:#999;font-size:14px;">欢迎使用建工青协管理后台</p>');

      document.getElementById('refreshDashboard').addEventListener('click', loadDashboard);
    });
    function card(n, label, color) {
      return '<div class="admin-stat-card"><div class="admin-stat-num"' + (color ? ' style="color:' + color + '"' : '') + '>' + n + '</div><div>' + label + '</div></div>';
    }
  }

  // ====== 报名管理 ======
  function loadApplications() {
    loadContent('<h2>报名管理</h2>'
      + '<div class="admin-toolbar"><input type="text" id="appSearch" placeholder="搜索姓名或联系方式..." class="admin-input">'
      + '<select id="appStatusFilter" class="admin-input" style="min-width:auto;"><option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option><option value="contacted">已联系</option></select>'
      + '<button id="exportCSV" class="btn btn-sm btn-outline">导出 CSV</button></div>'
      + '<div id="appTable"><div class="admin-loading">加载中...</div></div>');

    function load() {
      var search = document.getElementById('appSearch')?.value || '';
      var status = document.getElementById('appStatusFilter')?.value || '';
      var url = 'applications?order=created_at.desc';
      if (search) url += '&or=(name.ilike.*' + encodeURIComponent(search) + '*,contact.ilike.*' + encodeURIComponent(search) + '*)';
      if (status) url += '&status=eq.' + status;

      fetch(SUPABASE_URL + '/rest/v1/' + url, { headers: headers() })
        .then(function(r){ return r.json(); })
        .then(renderApps);
    }

    function renderApps(data) {
      var t = document.getElementById('appTable');
      if (!t) return;
      if (!data || !data.length) { t.innerHTML = '<p style="color:#999;padding:20px;">暂无报名数据</p>'; return; }
      var labels = { pending: '待审核', approved: '已通过', rejected: '已拒绝', contacted: '已联系' };
      t.innerHTML = '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>姓名</th><th>学院/专业</th><th>联系方式</th><th>志愿方向</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>'
        + data.map(function(a) {
          return '<tr><td>' + e(a.name) + '</td><td>' + e(a.department) + '</td><td>' + e(a.contact) + '</td><td>' + e(a.direction) + '</td>'
            + '<td><select class="status-sel" data-id="' + a.id + '">' + ['pending','approved','rejected','contacted'].map(function(s){ return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+(labels[s]||s)+'</option>'; }).join('') + '</select></td>'
            + '<td>' + fmtDate(a.created_at) + '</td>'
            + '<td><button class="btn btn-sm" style="color:#DC2626;" data-del="'+a.id+'">删除</button></td></tr>';
        }).join('') + '</tbody></table></div>';
      document.getElementById('appTable').querySelectorAll('.status-sel').forEach(function(s) {
        s.addEventListener('change', function() {
          fetch(SUPABASE_URL+'/rest/v1/applications?id=eq.'+this.getAttribute('data-id'), { method:'PATCH', headers:headers(), body:JSON.stringify({status:this.value}) })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
      document.getElementById('appTable').querySelectorAll('[data-del]').forEach(function(b) {
        b.addEventListener('click', function() { if(!confirm('确定删除?')) return;
          fetch(SUPABASE_URL+'/rest/v1/applications?id=eq.'+this.getAttribute('data-del'), { method:'DELETE', headers:headers() })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
    }

    load();
    document.getElementById('appSearch')?.addEventListener('input', load);
    document.getElementById('appStatusFilter')?.addEventListener('change', load);
    document.getElementById('exportCSV')?.addEventListener('click', function() {
      fetch(SUPABASE_URL+'/rest/v1/applications?order=created_at.desc', { headers: headers() })
        .then(function(r){ return r.json(); }).then(function(data) {
          if (!data || !data.length) { alert('无数据'); return; }
          var csv = '﻿姓名,学院专业,联系方式,志愿方向,可服务时间,状态,时间\n' + data.map(function(a){ return [a.name,a.department,a.contact,a.direction,a.available_time,a.status,a.created_at].join(','); }).join('\n');
          var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'applications.csv'; a.click();
        });
    });
  }

  // ====== 留言管理 ======
  function loadMessages() {
    loadContent('<h2>留言管理</h2><div class="admin-toolbar"><input type="text" id="msgSearch" placeholder="搜索内容..." class="admin-input"><select id="msgStatusFilter" class="admin-input" style="min-width:auto;"><option value="">全部</option><option value="false">未处理</option><option value="true">已处理</option></select></div><div id="msgTable"><div class="admin-loading">加载中...</div></div>');

    function load() {
      var search = document.getElementById('msgSearch')?.value || '';
      var handled = document.getElementById('msgStatusFilter')?.value;
      var url = 'messages?order=created_at.desc';
      if (search) url += '&or=(name.ilike.*' + encodeURIComponent(search) + '*,content.ilike.*' + encodeURIComponent(search) + '*)';
      if (handled !== '') url += '&is_handled=eq.' + handled;

      fetch(SUPABASE_URL + '/rest/v1/' + url, { headers: headers() })
        .then(function(r){ return r.json(); })
        .then(renderMsgs);
    }

    function renderMsgs(data) {
      var t = document.getElementById('msgTable');
      if (!t) return;
      if (!data || !data.length) { t.innerHTML = '<p style="color:#999;padding:20px;">暂无留言</p>'; return; }
      t.innerHTML = '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>姓名</th><th>联系方式</th><th>内容</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>'
        + data.map(function(m) {
          return '<tr><td>' + e(m.name) + '</td><td>' + e(m.contact) + '</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + e(m.content) + '">' + e(m.content) + '</td>'
            + '<td><span class="badge ' + (m.is_handled ? 'badge-green' : 'badge-orange') + '">' + (m.is_handled ? '已处理' : '未处理') + '</span></td>'
            + '<td>' + fmtDate(m.created_at) + '</td>'
            + '<td>' + (!m.is_handled ? '<button class="btn btn-sm mark-btn" data-id="'+m.id+'">处理</button> ' : '') + '<button class="btn btn-sm" style="color:#DC2626;" data-del="'+m.id+'">删除</button></td></tr>';
        }).join('') + '</tbody></table></div>';
      document.getElementById('msgTable').querySelectorAll('.mark-btn').forEach(function(b) {
        b.addEventListener('click', function() {
          fetch(SUPABASE_URL+'/rest/v1/messages?id=eq.'+this.getAttribute('data-id'), { method:'PATCH', headers:headers(), body:JSON.stringify({is_handled:true}) })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
      document.getElementById('msgTable').querySelectorAll('[data-del]').forEach(function(b) {
        b.addEventListener('click', function() { if(!confirm('确定删除?')) return;
          fetch(SUPABASE_URL+'/rest/v1/messages?id=eq.'+this.getAttribute('data-del'), { method:'DELETE', headers:headers() })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
    }

    load();
    document.getElementById('msgSearch')?.addEventListener('input', load);
    document.getElementById('msgStatusFilter')?.addEventListener('change', load);
  }

  // ====== 活动管理 ======
  function loadActivities() {
    loadContent('<h2>活动管理</h2><button id="addActBtn" class="btn btn-primary btn-sm" style="margin-bottom:16px;">+ 新增</button><div id="actTable"><div class="admin-loading">加载中...</div></div>');

    function load() {
      fetch(SUPABASE_URL + '/rest/v1/activities?order=event_date.desc', { headers: headers() })
        .then(function(r){ return r.json(); })
        .then(renderActs);
    }

    function renderActs(data) {
      var t = document.getElementById('actTable');
      if (!t) return;
      if (!data || !data.length) { t.innerHTML = '<p style="color:#999;padding:20px;">暂无活动</p>'; return; }
      t.innerHTML = '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>标题</th><th>分类</th><th>日期</th><th>发布</th><th>首页</th><th>操作</th></tr></thead><tbody>'
        + data.map(function(a) {
          return '<tr><td>' + e(a.title) + '</td><td>' + e(a.category) + '</td><td>' + e(a.event_date) + '</td>'
            + '<td><button class="btn btn-sm pub-btn" data-id="' + a.id + '" data-pub="' + (!a.is_published) + '">' + (a.is_published !== false ? '✅ 已发布' : '❌ 下架') + '</button></td>'
            + '<td><button class="btn btn-sm show-btn" data-id="' + a.id + '" data-show="' + (!a.show_on_home) + '">' + (a.show_on_home ? '✅' : '❌') + '</button></td>'
            + '<td><button class="btn btn-sm edit-btn" data-id="' + a.id + '">编辑</button> <button class="btn btn-sm" style="color:#DC2626;" data-del="' + a.id + '">删除</button></td></tr>';
        }).join('') + '</tbody></table></div>';

      document.getElementById('actTable').querySelectorAll('.pub-btn').forEach(function(b) {
        b.addEventListener('click', function() {
          fetch(SUPABASE_URL+'/rest/v1/activities?id=eq.'+this.getAttribute('data-id'), { method:'PATCH', headers:headers(), body:JSON.stringify({is_published: this.getAttribute('data-pub') === 'true'}) })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
      document.getElementById('actTable').querySelectorAll('.show-btn').forEach(function(b) {
        b.addEventListener('click', function() {
          fetch(SUPABASE_URL+'/rest/v1/activities?id=eq.'+this.getAttribute('data-id'), { method:'PATCH', headers:headers(), body:JSON.stringify({show_on_home: this.getAttribute('data-show') === 'true'}) })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
      document.getElementById('actTable').querySelectorAll('.edit-btn').forEach(function(b) {
        b.addEventListener('click', function() {
          var id = this.getAttribute('data-id');
          fetch(SUPABASE_URL+'/rest/v1/activities?id=eq.'+id, { headers: headers() })
            .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(function(d){
              if(d && d[0]) showActForm(d[0], load);
              else alert('未找到该活动');
            })
            .catch(function(e){
              console.error('编辑活动出错:', e);
              alert('获取活动数据失败: ' + (e.message || ''));
            });
        });
      });
      document.getElementById('actTable').querySelectorAll('[data-del]').forEach(function(b) {
        b.addEventListener('click', function() { if(!confirm('确定删除?')) return;
          fetch(SUPABASE_URL+'/rest/v1/activities?id=eq.'+this.getAttribute('data-del'), { method:'DELETE', headers:headers() })
            .then(load).then(refreshDashboardIfVisible);
        });
      });
    }

    load();
    document.getElementById('addActBtn').addEventListener('click', function() { showActForm(null, load); });
  }

  function showActForm(act, cb) {
    var isEdit = !!act;
    var overlay = document.createElement('div');
    overlay.className = 'admin-modal-overlay';
    overlay.innerHTML = '<div class="admin-modal"><h3>' + (isEdit ? '编辑活动' : '新增活动') + '</h3>'
      + inp('afTitle', '标题', act?.title) + inp('afCat', '分类', act?.category)
      + inp('afDate', '日期', act?.event_date, 'date') + inp('afTime', '时间', act?.event_time)
      + inp('afLoc', '地点', act?.location) + inp('afParts', '参与人数', act?.participants, 'number')
      + inp('afHours', '服务时长(h)', act?.service_hours, 'number')
      + '<div class="form-group"><label>活动封面图</label>'
      + '<div class="cover-upload-area" id="coverUploadArea">'
      + '<input type="file" id="afCoverFile" accept="image/jpeg,image/png,image/webp" style="display:none">'
      + '<div id="coverPlaceholder"><div class="cover-upload-icon">🖼️</div><p>点击或拖拽上传活动封面</p><small>JPG/PNG/WEBP, 最大 5MB</small></div>'
      + '<div id="coverPreviewBox" class="cover-preview" style="display:none;"></div>'
      + '</div>'
      + '<input type="hidden" id="afCoverUrl" value="' + e(act?.cover_image) + '">'
      + '<input type="hidden" id="afCoverChanged" value="">'
      + '</div>'
      + '<div class="form-group"><label>简介</label><textarea id="afDesc" rows="3">' + e(act?.description) + '</textarea></div>'
      + '<div class="form-group"><label>详细内容</label><textarea id="afDetail" rows="5">' + e(act?.detail_content) + '</textarea></div>'
      + '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">'
      + '<button class="btn btn-outline btn-sm" id="cancelAf">取消</button><button class="btn btn-primary btn-sm" id="saveAf">保存</button></div></div>';
    document.body.appendChild(overlay);

    // ---- 封面图上传逻辑 ----
    var coverFile = null; // 待上传的 File 对象
    var coverUploadArea = document.getElementById('coverUploadArea');
    var coverFileInput = document.getElementById('afCoverFile');
    var coverPlaceholder = document.getElementById('coverPlaceholder');
    var coverPreviewBox = document.getElementById('coverPreviewBox');
    var coverUrlInput = document.getElementById('afCoverUrl');
    var coverChangedInput = document.getElementById('afCoverChanged');

    // 编辑回显已有封面
    if (act?.cover_image) {
      showCoverPreview(act.cover_image);
    }

    function showCoverPreview(src) {
      coverPlaceholder.style.display = 'none';
      coverPreviewBox.style.display = 'block';
      coverPreviewBox.innerHTML = '<img src="' + e(src) + '" alt="封面预览" onerror="this.style.display=\'none\';">'
        + '<div class="cover-preview-actions">'
        + '<button type="button" class="btn btn-sm btn-outline" id="changeCoverBtn">更换图片</button>'
        + '<button type="button" class="btn btn-sm" style="color:#DC2626;" id="removeCoverBtn">移除图片</button>'
        + '</div>';
      document.getElementById('changeCoverBtn').addEventListener('click', function(){ coverFileInput.click(); });
      document.getElementById('removeCoverBtn').addEventListener('click', function(){
        coverFile = null; coverUrlInput.value = ''; coverChangedInput.value = 'removed';
        coverPlaceholder.style.display = 'block'; coverPreviewBox.style.display = 'none';
      });
    }

    function handleCoverFile(file) {
      if (!file.type.match(/image\/(jpeg|png|webp)/)) { alert('仅支持 JPG/PNG/WEBP 格式'); return; }
      if (file.size > 5*1024*1024) { alert('图片大小不能超过 5MB'); return; }
      coverFile = file; coverChangedInput.value = 'changed';
      // 本地预览
      var reader = new FileReader();
      reader.onload = function(e){ showCoverPreview(e.target.result); };
      reader.readAsDataURL(file);
    }

    coverUploadArea.addEventListener('click', function(e){ if(e.target.tagName!=='BUTTON') coverFileInput.click(); });
    coverFileInput.addEventListener('change', function(){ if(this.files&&this.files[0]) handleCoverFile(this.files[0]); });
    coverUploadArea.addEventListener('dragover', function(e){ e.preventDefault(); coverUploadArea.classList.add('drag-over'); });
    coverUploadArea.addEventListener('dragleave', function(){ coverUploadArea.classList.remove('drag-over'); });
    coverUploadArea.addEventListener('drop', function(e){ e.preventDefault(); coverUploadArea.classList.remove('drag-over'); if(e.dataTransfer.files&&e.dataTransfer.files[0]) handleCoverFile(e.dataTransfer.files[0]); });

    document.getElementById('cancelAf').addEventListener('click', function(){ overlay.remove(); });
    document.getElementById('saveAf').addEventListener('click', async function() {
      var d = {
        title: gv('afTitle'), category: gv('afCat'), event_date: gv('afDate'),
        event_time: gv('afTime'), location: gv('afLoc'),
        participants: parseInt(gv('afParts'))||0, service_hours: parseInt(gv('afHours'))||0,
        description: gv('afDesc'), detail_content: gv('afDetail')
      };
      if (!d.title) { alert('请输入标题'); return; }

      // 处理封面图
      var changed = coverChangedInput.value;
      if (changed === 'removed') {
        d.cover_image = null;
      } else if (changed === 'changed' && coverFile) {
        // 上传到 Supabase Storage
        var ext = coverFile.name.split('.').pop();
        var fname = 'covers/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
        var formData = new FormData();
        formData.append('file', coverFile);
        try {
          var upRes = await fetch(SUPABASE_URL + '/storage/v1/object/activity-covers/' + fname, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'apikey': ANON_KEY },
            body: coverFile
          });
          if (!upRes.ok) { var upErr = await upRes.json().catch(function(){return {};}); throw new Error(upErr.message || '上传失败'); }
          d.cover_image = SUPABASE_URL + '/storage/v1/object/public/activity-covers/' + fname;
        } catch(e) { alert('封面上传失败: ' + (e.message || '')); return; }
      } else {
        d.cover_image = coverUrlInput.value || null;
      }

      var url = isEdit ? SUPABASE_URL+'/rest/v1/activities?id=eq.'+act.id : SUPABASE_URL+'/rest/v1/activities';
      var method = isEdit ? 'PATCH' : 'POST';
      if (!isEdit) { d.show_on_home = true; d.is_published = true; }
      fetch(url, { method: method, headers: headers(), body: JSON.stringify(d) })
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); })
        .then(function() { overlay.remove(); cb(); refreshDashboardIfVisible(); })
        .catch(function(e){ alert('保存失败: ' + (e.message || '')); });
    });
    function inp(id, label, val, type) { return '<div class="form-group"><label>' + label + '</label><input id="' + id + '" value="' + e(val) + '"' + (type ? ' type="' + type + '"' : '') + '></div>'; }
    function gv(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  }

  // ====== 统计管理 ======
  function loadStats() {
    loadContent('<h2>统计管理</h2><div id="statsForm"><div class="admin-loading">加载中...</div></div>');
    fetch(SUPABASE_URL + '/rest/v1/site_stats?order=id', { headers: headers() })
      .then(function(r){ return r.json(); }).then(function(data) {
        var f = document.getElementById('statsForm');
        if (!data || !data.length) { f.innerHTML = '<p>暂无数据</p>'; return; }
        f.innerHTML = data.map(function(s) {
          return '<div class="form-group" style="margin-bottom:12px;"><label>' + e(s.label || s.key) + '</label><input type="number" id="st_' + s.key + '" value="' + s.value + '"></div>';
        }).join('') + '<button id="saveStatsBtn" class="btn btn-primary btn-sm" style="margin-top:12px;">保存</button>';
        document.getElementById('saveStatsBtn').addEventListener('click', function() {
          var promises = data.map(function(s) {
            var v = parseInt(document.getElementById('st_' + s.key).value)||0;
            return fetch(SUPABASE_URL+'/rest/v1/site_stats?key=eq.'+s.key, { method:'PATCH', headers:headers(), body:JSON.stringify({value:v}) });
          });
          Promise.all(promises).then(function() { alert('已保存'); loadDashboard(); });
        });
      });
  }

  function e(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(d) { return d ? new Date(d).toLocaleDateString('zh-CN') : ''; }

  // ====== 登出 ======
  document.getElementById('logoutBtn').addEventListener('click', function() {
    localStorage.clear();
    fetch(SUPABASE_URL + '/auth/v1/logout', { method: 'POST', headers: headers() }).catch(function(){});
    window.location.href = 'login.html';
  });
})();
</script>
</body>
</html>

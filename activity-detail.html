  .detail-card{max-width:940px;margin:0 auto;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:clamp(24px,4vw,46px);box-shadow:0 14px 36px rgba(37,22,16,.055)}

  .detail-back{display:inline-flex;align-items:center;gap:4px;margin-top:28px;color:var(--red);font-weight:700;font-size:14px;text-decoration:none}

  .detail-err{text-align:center;padding:72px 20px}
  .detail-err h2{font-size:21px;margin-bottom:8px;color:var(--text)}

  @media(max-width:768px){.detail-card{padding:22px 16px}.detail-card h1{font-size:24px}.detail-meta{font-size:13px;gap:8px 12px}.detail-cover img{max-height:320px}}

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://pzyijmgcksmyagdvdgoq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eWlqbWdja3NteWFnZHZkZ29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEzMTIsImV4cCI6MjA5NTMxNzMxMn0._sohNeH4Zh7qTaqLd0b8gY3GKg3t4ShJTSCkNEQfAyI';

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function fmtDate(value) {
    if (!value) return '时间待定';
    var d = new Date(value);
    if (Number.isNaN(d.getTime())) return esc(value);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  async function safeJson(response) {
    var text = await response.text();
    if (!response.ok) throw new Error(text || ('HTTP ' + response.status));
    return text ? JSON.parse(text) : null;
  }

  var navBtn = document.getElementById('navToggle');
  var navList = document.getElementById('navList');
  if (navBtn && navList) {
    navBtn.addEventListener('click', function () {
      var isOpen = navList.classList.toggle('open');
      navBtn.setAttribute('aria-expanded', String(isOpen));
    });
    navList.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () { navList.classList.remove('open'); });
    });
  }

  function errorState(title, text) {
    return '<div class="detail-err"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><a href="index.html#activities" class="btn btn-red">返回活动风采</a></div>';
  }

  function renderDetail(activity) {
    var title = activity.title || '活动详情';
    var category = activity.category || '活动';
    var date = fmtDate(activity.date || activity.event_date);
    var time = activity.time || activity.event_time || '';
    var location = activity.location || '待定';
    var volunteers = activity.volunteers_count != null ? activity.volunteers_count : activity.participants;
    var hours = activity.service_hours || 0;
    var content = String(activity.detail_content || activity.description || '暂无详细介绍');
    var coverHtml = activity.cover_image
      ? '<img src="' + esc(activity.cover_image) + '" alt="' + esc(title) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';"><div class="ph" style="display:none">' + esc(category) + '</div>'
      : '<div class="ph">' + esc(category) + '</div>';

    document.title = title + ' | 建工青协';
    document.getElementById('detailContainer').innerHTML =
      '<div class="detail-topline"><span class="detail-cat">' + esc(category) + '</span></div>'
      + '<h1>' + esc(title) + '</h1>'
      + '<div class="detail-meta">'
      + '<span>日期：' + date + (time ? ' ' + esc(time) : '') + '</span>'
      + '<span>地点：' + esc(location) + '</span>'
      + '<span>人数：' + esc(volunteers || 0) + '人</span>'
      + '<span>时长：' + esc(hours) + 'h</span>'
      + '</div>'
      + '<div class="detail-cover">' + coverHtml + '</div>'
      + '<div class="detail-body-text">' + content.split(/\n+/).filter(Boolean).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>'
      + '<a href="index.html#activities" class="detail-back">&larr; 返回活动风采</a>';
  }

  async function loadDetail() {
    var id = new URLSearchParams(window.location.search).get('id');
    var container = document.getElementById('detailContainer');
    if (!id) {
      container.innerHTML = errorState('缺少活动 ID', '请从活动列表进入详情页。');
      return;
    }

    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/activities?id=eq.' + encodeURIComponent(id) + '&is_published=eq.true', {
        headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY }
      });
      var data = await safeJson(res);
      if (!Array.isArray(data) || !data.length) {
        container.innerHTML = errorState('活动不存在或已下架', '该活动可能已被移除或暂未发布。');
        return;
      }
      renderDetail(data[0]);
    } catch (err) {
      console.error('活动详情加载失败:', err);
      container.innerHTML = errorState('活动加载失败', '请稍后重试。');
    }
  }

  loadDetail();
})();
</script>

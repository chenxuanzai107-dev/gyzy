<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://pzyijmgcksmyagdvdgoq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eWlqbWdja3NteWFnZHZkZ29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEzMTIsImV4cCI6MjA5NTMxNzMxMn0._sohNeH4Zh7qTaqLd0b8gY3GKg3t4ShJTSCkNEQfAyI';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(v) { if(!v) return ''; var d=new Date(v); if(isNaN(d.getTime())) return v; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  var p = new URLSearchParams(window.location.search);
  var id = p.get('id');
  var c = document.getElementById('detailContainer');

  if (!id) {
    c.innerHTML = '<div class="detail-err"><h2>缺少活动ID</h2><p>请从活动列表进入</p><a href="index.html" class="btn btn-red">返回首页</a></div>';
  } else {
    fetch(SUPABASE_URL + '/rest/v1/activities?id=eq.' + id + '&is_published=eq.true', { headers: { 'apikey': ANON_KEY } })
      .then(function(r) { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data) {
        if (!data || !data.length) { c.innerHTML = '<div class="detail-err"><h2>活动不存在或已下架</h2><p>该活动可能已被移除</p><a href="index.html" class="btn btn-red">返回首页</a></div>'; return; }
        var a = data[0];
        document.title = esc(a.title) + ' | 建工青协';

        var coverHtml = a.cover_image
          ? '<img src="' + esc(a.cover_image) + '" alt="' + esc(a.title) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';"><div class="ph" style="display:none">' + esc(a.category||'建工青协') + '</div>'
          : '<div class="ph">' + esc(a.category||'建工青协') + '</div>';

        var body = a.detail_content || a.description || '暂无详细介绍';

        c.innerHTML =
          '<div class="detail-topline"><span class="detail-cat">' + esc(a.category||'') + '</span></div>'
          + '<h1>' + esc(a.title||'') + '</h1>'
          + '<div class="detail-meta">'
          + '<span>📅 ' + fmtDate(a.date||a.event_date) + (a.time||a.event_time?' '+esc(a.time||a.event_time):'') + '</span>'
          + '<span>📍 ' + esc(a.location||'待定') + '</span>'
          + '<span>👥 ' + (a.volunteers_count ?? a.participants ?? 0) + '人</span>'
          + '<span>⏱ ' + (a.service_hours || 0) + 'h</span>'
          + '</div>'
          + '<div class="detail-cover">' + coverHtml + '</div>'
          + '<div class="detail-body-text">' + body.split('\n').filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join('') + '</div>'
          + '<a href="index.html#activities" class="detail-back">&larr; 返回活动风采</a>';
      })
      .catch(function() {
        c.innerHTML = '<div class="detail-err"><h2>加载失败</h2><p>请稍后重试</p><a href="index.html" class="btn btn-red">返回首页</a></div>';
      });
  }
})();
</script>

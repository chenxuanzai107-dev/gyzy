<style>
  .detail-page { padding-top: calc(var(--nav-height) + 32px); padding-bottom: var(--section-gap); min-height: 100vh; background: var(--color-bg); }
  .detail-container { max-width: 800px; margin: 0 auto; padding: 0 var(--content-padding); }

  .detail-category { display: inline-block; padding: 4px 14px; border-radius: 999px; background: var(--color-bg-alt); color: var(--color-fg-muted); font-size: 13px; font-weight: 600; margin-bottom: 12px; border: 1px solid var(--color-border); }
  .detail-header h1 { font-size: clamp(24px, 4vw, 40px); color: var(--color-fg); margin-bottom: 16px; }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 20px; color: var(--color-fg-muted); font-size: 14px; margin-bottom: 24px; }
  .detail-meta span { display: flex; align-items: center; gap: 6px; }
  .detail-cover { border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 28px; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary), #FCD34D); min-height: 240px; display: flex; align-items: center; justify-content: center; }
  .detail-cover img { width: 100%; height: auto; max-height: 400px; object-fit: cover; display: block; }
  .detail-cover-placeholder { color: #fff; font-size: clamp(18px, 2vw, 28px); font-family: var(--font-heading); font-weight: 600; padding: 40px; text-align: center; }
  .detail-content { background: var(--color-bg-card); border-radius: var(--radius-lg); padding: clamp(24px, 3vw, 40px); border: 1px solid var(--color-border); line-height: 1.9; font-size: clamp(15px, 1.3vw, 17px); color: var(--color-fg); }
  .detail-content p { margin-bottom: 16px; }
  .detail-back { display: inline-flex; align-items: center; gap: 6px; margin-top: 28px; color: var(--color-accent); font-weight: 600; font-size: 15px; }
  .detail-back:hover { color: var(--color-accent-hover); }
  .detail-error { text-align: center; padding: 80px 20px; }
  .detail-error h2 { font-size: 24px; color: var(--color-fg); margin-bottom: 12px; }
  .detail-error p { color: var(--color-fg-muted); margin-bottom: 24px; }
  @media (max-width: 768px) {
    .detail-meta { gap: 12px; }
    .detail-cover { min-height: 180px; }
  }

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://pzyijmgcksmyagdvdgoq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eWlqbWdja3NteWFnZHZkZ29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEzMTIsImV4cCI6MjA5NTMxNzMxMn0._sohNeH4Zh7qTaqLd0b8gY3GKg3t4ShJTSCkNEQfAyI';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var container = document.getElementById('detailContainer');

  if (!id) {
    container.innerHTML = '<div class="detail-error"><h2>缺少活动参数</h2><p>请从活动列表进入此页面</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
  } else {
    fetch(SUPABASE_URL + '/rest/v1/activities?id=eq.' + id + '&is_published=eq.true', {
      headers: { 'apikey': ANON_KEY }
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data) {
      if (!data || !data.length) {
        container.innerHTML = '<div class="detail-error"><h2>活动不存在或已下架</h2><p>该活动可能已被移除或尚未发布</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
        return;
      }
      renderDetail(data[0]);
    }).catch(function(e) {
      console.error('详情加载失败:', e);
      container.innerHTML = '<div class="detail-error"><h2>加载失败</h2><p>活动详情加载失败，请稍后重试</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
    });
  }

  function renderDetail(a) {
    document.title = esc(a.title) + ' | 建工青协活动详情';

    var coverHtml;
    if (a.cover_image) {
      coverHtml = '<img src="' + esc(a.cover_image) + '" alt="' + esc(a.title) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<div class="detail-cover-placeholder" style="display:none">' + esc(a.category || '') + '</div>';
    } else {
      coverHtml = '<div class="detail-cover-placeholder">' + esc(a.category || '') + '</div>';
    }

    var content = a.detail_content || a.description || '暂无详细介绍';

    container.innerHTML =
      '<div class="detail-header">'
      + '<span class="detail-category">' + esc(a.category || '') + '</span>'
      + '<h1>' + esc(a.title || '') + '</h1>'
      + '<div class="detail-meta">'
      + '<span>📅 ' + esc(a.event_date || '') + ' ' + esc(a.event_time || '') + '</span>'
      + '<span>📍 ' + esc(a.location || '待定') + '</span>'
      + '<span>👥 ' + (a.participants || 0) + ' 人</span>'
      + '<span>⏱ ' + (a.service_hours || 0) + ' 小时</span>'
      + '</div></div>'
      + '<div class="detail-cover">' + coverHtml + '</div>'
      + '<div class="detail-content">' + content.split('\n').map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>'
      + '<a href="index.html" class="detail-back">&larr; 返回首页</a>';
  }
})();
</script>

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://pzyijmgcksmyagdvdgoq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eWlqbWdja3NteWFnZHZkZ29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEzMTIsImV4cCI6MjA5NTMxNzMxMn0._sohNeH4Zh7qTaqLd0b8gY3GKg3t4ShJTSCkNEQfAyI';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var container = document.getElementById('detailContainer');

  if (!id) {
    container.innerHTML = '<div class="detail-error"><h2>缺少活动参数</h2><p>请从活动列表进入此页面</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
  } else {
    fetch(SUPABASE_URL + '/rest/v1/activities?id=eq.' + id + '&is_published=eq.true', { headers: { 'apikey': ANON_KEY } })
      .then(function(r) { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data) {
        if (!data || !data.length) {
          container.innerHTML = '<div class="detail-error"><h2>活动不存在或已下架</h2><p>该活动可能已被移除</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
        } else { renderDetail(data[0]); }
      })
      .catch(function() {
        container.innerHTML = '<div class="detail-error"><h2>加载失败</h2><p>请稍后重试</p><a href="index.html" class="btn btn-primary">返回首页</a></div>';
      });
  }

  function renderDetail(a) {
    document.title = esc(a.title) + ' | 建工青协';
    document.getElementById('detailBannerTitle').textContent = a.title || '活动详情';

    var coverHtml = a.cover_image
      ? '<img src="' + esc(a.cover_image) + '" alt="' + esc(a.title) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';"><span class="placeholder" style="display:none">' + esc(a.category || '') + '</span>'
      : '<span class="placeholder">' + esc(a.category || '活动封面') + '</span>';

    var content = a.detail_content || a.description || '暂无详细介绍';

    container.innerHTML =
      '<div class="detail-cover-wrap">' + coverHtml + '</div>'
      + '<span class="activity-category-tag" style="margin-bottom:12px;">' + esc(a.category || '') + '</span>'
      + '<div class="detail-meta-row">'
      + '<span>📅 ' + esc(a.event_date || '') + ' ' + esc(a.event_time || '') + '</span>'
      + '<span>📍 ' + esc(a.location || '待定') + '</span>'
      + '<span>👥 ' + (a.participants || 0) + ' 人</span>'
      + '<span>⏱ ' + (a.service_hours || 0) + ' 小时</span>'
      + '</div>'
      + '<div class="detail-content">' + content.split('\n').map(function(p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>'
      + '<a href="index.html#activities" class="detail-back">&larr; 返回活动列表</a>';
  }
})();
</script>

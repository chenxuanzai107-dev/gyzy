<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理登录 | 建工青协</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9825;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

<div class="login-card">
  <h1>建工青协</h1>
  <p>管理后台登录</p>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="email">管理员邮箱</label>
      <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" required placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" id="loginBtn">登录</button>
    <p class="error-msg" id="loginError"></p>
  </form>

  <a href="index.html" class="back-link">&larr; 返回前台首页</a>
</div>

<!-- Supabase SDK + Auth + Config -->
<script src="assets/js/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  'use strict';

  // 如果已登录，直接跳转
  window.appAuth.checkAuth().then(function (r) {
    if (r.user) window.location.href = 'admin.html';
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginError');
    btn.disabled = true;
    btn.textContent = '登录中...';
    err.textContent = '';

    try {
      await window.appAuth.login(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      window.location.href = 'admin.html';
    } catch (ex) {
      err.textContent = ex.message || '登录失败，请检查邮箱和密码';
    } finally {
      btn.disabled = false;
      btn.textContent = '登录';
    }
  });
})();
</script>
</body>
</html>

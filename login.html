<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理登录 | 建工青协</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9825;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css?v=unicloud-20260616">
</head>
<body class="login-page">

<div class="login-card">
  <h1>建工青协</h1>
  <p>管理后台登录</p>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="email">管理员邮箱</label>
      <input type="email" id="email" required placeholder="admin@gyzy.org" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" required placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" id="loginBtn">登录</button>
    <p class="error-msg" id="loginError"></p>
    <p class="error-msg" id="loginDebug" style="font-size:11px;color:#999;margin-top:4px;"></p>
  </form>

  <a href="index.html" class="back-link">&larr; 返回前台首页</a>
</div>

<script src="js/backend-config.js?v=unicloud-20260616"></script>
<script src="js/unicloud-backend.js?v=unicloud-20260616"></script>
<script src="js/login-cloudbase.js?v=unicloud-20260616"></script>
</body>
</html>

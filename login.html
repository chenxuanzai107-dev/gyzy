<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理登录 | 建工青协</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9825;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

<div class="login-card">
  <h1>建工青协</h1>
  <p>管理后台登录</p>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="email">管理员邮箱</label>
      <input type="email" id="email" required placeholder="admin@gyzy.org" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" required placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" id="loginBtn">登录</button>
    <p class="error-msg" id="loginError"></p>
  </form>

  <a href="index.html" class="back-link">&larr; 返回前台首页</a>
</div>

<script>
// 纯 fetch 登录，无需任何外部 SDK
(function () {
  'use strict';

  var SUPABASE_URL = 'https://pzyijmgcksmyagdvdgoq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6eWlqbWdja3NteWFnZHZkZ29xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEzMTIsImV4cCI6MjA5NTMxNzMxMn0._sohNeH4Zh7qTaqLd0b8gY3GKg3t4ShJTSCkNEQfAyI';

  // 如果已有 token，验证并跳转
  var token = localStorage.getItem('gyzy_token');
  if (token) {
    fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (r.ok) { window.location.href = 'admin.html'; }
      else { localStorage.removeItem('gyzy_token'); }
    }).catch(function(){});
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginError');
    btn.disabled = true;
    btn.textContent = '连接中...';
    err.textContent = '';

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      err.textContent = '请输入邮箱和密码';
      btn.disabled = false;
      btn.textContent = '登录';
      return;
    }

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) {
      if (!r.ok) {
        return r.json().then(function(d) {
          throw new Error(d.error_description || d.msg || '账号或密码错误');
        });
      }
      return r.json();
    })
    .then(function(data) {
      localStorage.setItem('gyzy_token', data.access_token);
      localStorage.setItem('gyzy_refresh', data.refresh_token);
      localStorage.setItem('gyzy_user', JSON.stringify(data.user));
      window.location.href = 'admin.html';
    })
    .catch(function(ex) {
      if (ex.message.includes('Failed to fetch') || ex.message.includes('NetworkError')) {
        err.textContent = '网络连接失败，请检查网络后重试';
      } else {
        err.textContent = ex.message;
      }
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '登录';
    });
  });
})();
</script>
</body>
</html>
